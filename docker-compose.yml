services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: chipdev:dev
    ports:
      - "8787:8787"
    volumes:
      - chipdev_state:/app/.chipdev

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    working_dir: /app
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  chipdev_state:
  frontend_node_modules:
